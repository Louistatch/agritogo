name: Pre-commit

on: [push, pull_request]

permissions:
  contents: read

# The inherited upstream pre-commit job ran --all-files, including thousands
# of unrelated legacy formatting/type warnings. Keep a real blocking safety
# gate on every changed file; migrate repository-wide style debt separately.
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find changed files and check whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base=""
          fi

          if [ -n "$base" ]; then
            git diff --check "$base" HEAD
            git diff --name-only --diff-filter=ACMR "$base" HEAD > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi

      - name: Install static validation tools
        run: |
          python -m pip install pre-commit ruff

      - name: Validate changed files
        shell: bash
        run: |
          mapfile -t changed < changed-files.txt
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files"
            exit 0
          fi

          for hook in check-ast check-yaml check-xml check-toml check-json check-docstring-first detect-private-key; do
            pre-commit run "$hook" --files "${changed[@]}"
          done

          mapfile -t python_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.py$' || true)
          if [ "${#python_files[@]}" -gt 0 ]; then
            python -m compileall -q "${python_files[@]}"
            ruff check --select E4,E7,E9,F63,F7,F82 "${python_files[@]}"
          fi
