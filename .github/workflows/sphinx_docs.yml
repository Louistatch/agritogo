# The legacy Sphinx workflow published upstream AgentScope documentation to
# doc.agentscope.io. This repository is AgriTogo, not AgentScope, and must not
# publish or claim another project's documentation domain.
name: AgriTogo Documentation Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/sphinx_docs.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/sphinx_docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout AgriTogo
        uses: actions/checkout@v4

      - name: Validate AgriTogo documentation sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          documents = [
              Path("README.md"),
              Path("docs/PRICE_FORECAST_AUDIT.md"),
          ]
          for document in documents:
              text = document.read_text(encoding="utf-8")
              if not text.strip():
                  raise SystemExit(f"Empty documentation: {document}")
              if not text.lstrip().startswith("# "):
                  raise SystemExit(f"Missing Markdown title: {document}")
              print(f"PASS {document} ({len(text)} chars)")

          print("AgriTogo documentation sources checked.")
          print("Legacy AgentScope Sphinx/Pages publishing is disabled.")
          PY
