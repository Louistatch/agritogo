name: CPC Market Data Ingestion

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/ingestion/**"
      - "scripts/cpc_*.py"
      - "requirements-ingestion.txt"
      - ".github/workflows/cpc-market-ingestion.yml"
  schedule:
    # Four light checks per day. The pipeline hashes payloads and is idempotent.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: cpc-market-ingestion
  # Un passage planifié ne doit pas tuer un passage en cours au milieu de la
  # publication (lots de 100) : il attend son tour.
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .
      CPC_URL: https://www.cpc-togo.com/prixproduit
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CPC_BROWSER_WS_ENDPOINT: ${{ secrets.CPC_BROWSER_WS_ENDPOINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ingestion.txt

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ingestion.txt
          python -m playwright install --with-deps chromium

      - name: Run CPC discovery and ingestion
        run: |
          mkdir -p artifacts
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/cpc_ingest.py --dry-run --report artifacts/cpc-ingestion-report.json
          else
            python scripts/cpc_ingest.py --report artifacts/cpc-ingestion-report.json
          fi

      - name: Upload discovery and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-ingestion-report-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
