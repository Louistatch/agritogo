name: Python Unittest Coverage

on: [push, pull_request]

# The repository contains an upstream AgentScope test tree, which requires an
# unrelated full package install and external integrations. Validate the
# AgriTogo CPC ingestion module in isolation, on all supported Python versions.
jobs:
  test:
    if: ${{ !contains(github.event.pull_request.title, 'WIP') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage pytest requests
      - name: Run CPC regression tests with coverage
        env:
          PYTHONPATH: .
        run: |
          coverage run --source=app.ingestion.cpc -m pytest -q tests/test_cpc_ingestion.py
      - name: Generate coverage report
        run: coverage report -m
